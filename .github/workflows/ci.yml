name: benchmark-ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: benchmark-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-09-10
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Compile Python benchmark tools
        run: python -m py_compile generate_science_suite.py evaluate_quality.py verify_quality_gate.py verify_corpus.py security_release_gate.py run_benchmark.py
      - name: Verify deterministic generated benchmark suite
        run: python generate_science_suite.py --check
      - name: Verify corpus and coverage invariants
        run: python verify_corpus.py
      - name: Verify detector-quality scorer
        run: python evaluate_quality.py self-test --focus drift
      - name: Verify FPR/FNR regression gate
        run: python verify_quality_gate.py
      - name: Verify benchmark security release gate
        shell: bash
        run: python security_release_gate.py | tee benchmark-security-release-evidence.json
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Strict lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Property and regression tests
        run: cargo test --locked
      - name: Reference benchmark
        run: python run_benchmark.py > benchmark-result.json
      - name: Upload benchmark result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-result
          path: |
            benchmark-result.json
            benchmark-security-release-evidence.json
          if-no-files-found: error
          retention-days: 30
